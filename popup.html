<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Design DNA Extractor</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    width: 360px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #0f0f11;
    color: #e8e8ea;
    min-height: 200px;
  }

  .header {
    padding: 16px 18px 12px;
    border-bottom: 1px solid #1e1e24;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .logo {
    width: 32px;
    height: 32px;
    background: linear-gradient(135deg, #7c3aed, #4f46e5);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    flex-shrink: 0;
  }

  .header-text h1 {
    font-size: 13px;
    font-weight: 600;
    color: #f0f0f2;
    letter-spacing: -0.2px;
  }

  .header-text p {
    font-size: 11px;
    color: #666;
    margin-top: 1px;
  }

  .body { padding: 14px 18px; }

  .site-info {
    background: #16161a;
    border: 1px solid #1e1e24;
    border-radius: 8px;
    padding: 10px 12px;
    margin-bottom: 12px;
    display: none;
  }

  .site-info.visible { display: block; }

  .site-info .domain {
    font-size: 12px;
    color: #7c3aed;
    font-weight: 500;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .site-info .site-title {
    font-size: 11px;
    color: #555;
    margin-top: 2px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .extract-btn {
    width: 100%;
    padding: 11px;
    background: linear-gradient(135deg, #7c3aed, #4f46e5);
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    letter-spacing: 0.1px;
    transition: opacity 0.15s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
  }

  .extract-btn:hover { opacity: 0.9; }
  .extract-btn:active { opacity: 0.8; transform: scale(0.99); }
  .extract-btn:disabled { opacity: 0.5; cursor: not-allowed; }

  .progress {
    display: none;
    margin-top: 12px;
  }

  .progress.visible { display: block; }

  .progress-bar-track {
    height: 3px;
    background: #1e1e24;
    border-radius: 2px;
    overflow: hidden;
    margin-bottom: 8px;
  }

  .progress-bar {
    height: 100%;
    background: linear-gradient(90deg, #7c3aed, #4f46e5);
    border-radius: 2px;
    width: 0%;
    transition: width 0.4s ease;
  }

  .progress-steps {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .step {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 11px;
    color: #444;
    transition: color 0.2s;
  }

  .step.active { color: #a78bfa; }
  .step.done { color: #4ade80; }

  .step-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #222;
    flex-shrink: 0;
    transition: background 0.2s;
  }

  .step.active .step-dot { background: #7c3aed; animation: pulse 1s infinite; }
  .step.done .step-dot { background: #4ade80; }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  .results {
    display: none;
    margin-top: 12px;
  }

  .results.visible { display: block; }

  .result-stats {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
    margin-bottom: 10px;
  }

  .stat-pill {
    background: #16161a;
    border: 1px solid #1e1e24;
    border-radius: 6px;
    padding: 8px 10px;
    text-align: center;
  }

  .stat-pill .num {
    font-size: 18px;
    font-weight: 700;
    color: #a78bfa;
  }

  .stat-pill .lbl {
    font-size: 10px;
    color: #555;
    margin-top: 1px;
  }

  .preview-box {
    background: #0a0a0d;
    border: 1px solid #1e1e24;
    border-radius: 8px;
    padding: 10px 12px;
    margin-bottom: 10px;
    max-height: 120px;
    overflow: hidden;
    position: relative;
  }

  .preview-box pre {
    font-size: 10px;
    color: #555;
    font-family: 'SF Mono', 'Fira Code', monospace;
    white-space: pre-wrap;
    word-break: break-all;
    line-height: 1.5;
  }

  .preview-fade {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 40px;
    background: linear-gradient(transparent, #0a0a0d);
    pointer-events: none;
  }

  .actions {
    display: flex;
    gap: 6px;
  }

  .btn-download {
    flex: 1;
    padding: 9px;
    background: #7c3aed;
    color: white;
    border: none;
    border-radius: 7px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
    transition: opacity 0.15s;
  }

  .btn-download:hover { opacity: 0.85; }

  .btn-copy {
    flex: 1;
    padding: 9px;
    background: #16161a;
    color: #a78bfa;
    border: 1px solid #2a2a35;
    border-radius: 7px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
    transition: all 0.15s;
  }

  .btn-copy:hover { background: #1e1e28; }
  .btn-copy.copied { color: #4ade80; border-color: #4ade80; }

  .btn-reset {
    padding: 9px 11px;
    background: transparent;
    color: #444;
    border: 1px solid #1e1e24;
    border-radius: 7px;
    font-size: 11px;
    cursor: pointer;
    transition: all 0.15s;
  }

  .btn-reset:hover { color: #888; border-color: #333; }

  .error-box {
    background: #1a0a0a;
    border: 1px solid #3d1515;
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 11px;
    color: #f87171;
    display: none;
    margin-top: 10px;
  }

  .error-box.visible { display: block; }

  .footer {
    padding: 8px 18px 12px;
    font-size: 10px;
    color: #333;
    text-align: center;
    border-top: 1px solid #141418;
    margin-top: 4px;
  }

  .spinner {
    width: 12px;
    height: 12px;
    border: 2px solid rgba(255,255,255,0.3);
    border-top-color: white;
    border-radius: 50%;
    animation: spin 0.6s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="header">
  <div class="logo">🧬</div>
  <div class="header-text">
    <h1>Design DNA Extractor</h1>
    <p>Extract any site's design system → SKILL.md</p>
  </div>
</div>

<div class="body">

  <div class="site-info" id="siteInfo">
    <div class="domain" id="siteDomain">—</div>
    <div class="site-title" id="siteTitle">—</div>
  </div>

  <button class="extract-btn" id="extractBtn">
    <span>⚡</span>
    <span>Extract Design DNA</span>
  </button>

  <div class="progress" id="progress">
    <div class="progress-bar-track">
      <div class="progress-bar" id="progressBar"></div>
    </div>
    <div class="progress-steps" id="progressSteps"></div>
  </div>

  <div class="error-box" id="errorBox"></div>

  <div class="results" id="results">
    <div class="result-stats" id="resultStats"></div>
    <div class="preview-box">
      <pre id="previewText"></pre>
      <div class="preview-fade"></div>
    </div>
    <div class="actions">
      <button class="btn-download" id="downloadBtn">
        ↓ Download .md
      </button>
      <button class="btn-copy" id="copyBtn">
        ⎘ Copy
      </button>
      <button class="btn-reset" id="resetBtn">↺</button>
    </div>
  </div>

</div>

<div class="footer">Design inspiration only — do not copy proprietary content</div>

<script src="popup.js"></script>
</body>
</html>
